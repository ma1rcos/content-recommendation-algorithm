[package]
name = "recommendation-api"
version = "0.1.0"
edition = "2024"
# sqlx 0.9 exige Rust >= 1.94. Testado com 1.97.0 (mesma versão da imagem Docker de build).
rust-version = "1.94"
publish = false

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[dependencies]
actix-cors = "0.7.2"
actix-web = "4.15.0"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "serde", "std"] }
futures-util = "0.3.34"
hex = "0.4.3"
hmac = "0.13.0"
prometheus = { version = "0.14.0", default-features = false }
redis = { version = "1.7.1", features = ["tokio-comp", "connection-manager", "script"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "postgres", "chrono"] }
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["macros", "rt-multi-thread", "time", "sync", "signal"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["json", "env-filter"] }
uuid = { version = "1.28.0", features = ["v4", "serde"] }

[dev-dependencies]
actix-rt = "2.15.0"
